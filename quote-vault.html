<!DOCTYPE html>
<html>
    <head>
        <title>Quote Vault</title>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <link href="media/images/favicon/favicon.png" rel="icon" type="image/png"/>
        <link rel="stylesheet" href="scripts/style.css">
        <style>
            .gallery-img {
                cursor: zoom-in;
                transition: all 0.3s ease;
            }

            .gallery-img.enlarged {
                cursor: zoom-out;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
                object-fit: contain;
                background: rgba(0, 0, 0, 0.9);
                z-index: 1000;
            }

            .overlay-backdrop {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.85);
                z-index: 999;
            }

            .overlay-backdrop.active {
                display: block;
            }
        </style>
    </head>
    <body>
        <a href="index.html">Home</a>
        <br><hr>
        <div class="overlay-backdrop" id="overlayBackdrop"></div>

        <img src="quote-vault-media/amasa-lyman/amasa-lyman1.jpg" alt="Amasa Lyman Quote" class="gallery-img">
        <img src="quote-vault-media/brigham-young-jr/brigham-young-jr1.jpg" alt="Brigham Young Jr Quote" class="gallery-img">
        <img src="quote-vault-media/ezra-t-benson/ezra-t-benson1.jpg" alt="Ezra T. Benson" class="gallery-img">
        <img src="quote-vault-media/brigham-young/brigham-young1.jpg" alt="Brigham Young Quote" class="gallery-img">
        <img src="quote-vault-media/albert-e-bowen/albert-e-bowen1.jpg" alt="Albert E. Bowen Quote" class="gallery-img">
        <img src="quote-vault-media/abraham-o-woodruff/abraham-o-woodruff1.jpg" alt="Abraham O. Woodruff Quote" class="gallery-img">
        <img src="quote-vault-media/heber-c-kimball/heber-c-kimball1.jpg" alt="Heber C. Kimball Quote" class="gallery-img">

        <script>
            const images = document.querySelectorAll('.gallery-img');
            const backdrop = document.getElementById('overlayBackdrop');

            images.forEach(img => {
                img.addEventListener('click', () => {
                    const isEnlarged = img.classList.contains('enlarged');

                    images.forEach(i => {
                        if (i !== img) i.classList.remove('enlarged');
                    });

                    img.classList.toggle('enlarged', !isEnlarged);
                    backdrop.classList.toggle('active', !isEnlarged);
                });
            });

            backdrop.addEventListener('click', () => {
                images.forEach(img => img.classList.remove('enlarged'));
                backdrop.classList.remove('active');
            });
        </script>
    </body>
</html>

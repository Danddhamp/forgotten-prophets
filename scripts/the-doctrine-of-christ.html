<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doctrine of Christ</title>
    <link rel="icon" type="image/png" href="../favicon/favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #023465;
        }

        /* Home Button Styling */
        .home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(2, 52, 101, 0.85);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .home-button svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .home-button:hover {
            background: #ffd24d;
            color: #002E5D;
            border-color: #ffd24d;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        /* Split Screen Main Container */
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Base styling for both halves */
        .split-side {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            overflow: hidden;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
            transition: flex 0.4s ease;
        }

        .split-side:last-child {
            border-right: none;
        }

        /* Hover expansion effect */
        .split-side:hover {
            flex: 1.15;
        }

        /* Text overlay styling */
        .side-label {
            position: relative;
            z-index: 10;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 18px 36px;
            background: rgba(2, 52, 101, 0.75);
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease;
        }

        .split-side:hover .side-label {
            background: #ffd24d;
            color: #002E5D;
            border-color: #ffd24d;
            transform: scale(1.05);
        }

        /* --- LEFT SIDE: TOPICS --- */
        .topics-side {
            background: linear-gradient(135deg, #002E5D 0%, #023465 100%);
        }

        /* --- RIGHT SIDE: TEACHINGS --- */
        .teachings-side {
            background-color: #001f3f;
        }

        /* Dimming layer to make text readable over moving images */
        .split-side::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(2, 52, 101, 0.55);
            z-index: 1;
        }

        /* GRID CAROUSEL TRACK (Multi-Row Layout) */
        .carousel-track {
            display: grid;
            /* Creates 2 distinct horizontal rows. Change to repeat(3, 1fr) for 3 rows */
            grid-template-rows: repeat(2, 1fr);
            grid-auto-flow: column;
            grid-auto-columns: 240px; /* Fixed width of each photo */
            gap: 12px;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            padding: 12px;
            animation: slideLeft 45s linear infinite;
        }

        /* Pause animation on hover */
        .split-side:hover .carousel-track {
            animation-play-state: paused;
        }

        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7) grayscale(20%);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Continuous Sliding Animation */
        @keyframes slideLeft {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .home-button {
                top: 15px;
                left: 15px;
                width: 42px;
                height: 42px;
            }
            .home-button svg {
                width: 20px;
                height: 20px;
            }
            .split-container {
                flex-direction: column;
            }
            .split-side {
                border-right: none;
                border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            }
            .side-label {
                font-size: 1.8rem;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tracks = document.querySelectorAll('.carousel-track');

            tracks.forEach(track => {
                // 1. Get original image list and shuffle
                const images = Array.from(track.children);
                for (let i = images.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [images[i], images[j]] = [images[j], images[i]];
                }

                // 2. Clear track and render shuffled images
                track.innerHTML = '';
                images.forEach(img => track.appendChild(img));

                // 3. Duplicate images so the 50% translation loop is seamless
                images.forEach(img => track.appendChild(img.cloneNode(true)));
            });
        });
    </script>

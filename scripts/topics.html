<!DOCTYPE html>
<html>
    <head>
        <title>Topics</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../media/images/favicon/favicon.png" type="image/x-icon">
        <style>
            #searchBar {
                    width: 300px;
                    max-width: 90%;
                    padding: 8px 12px;
                    margin: 15px 0;
                    font-size: 16px;
                    border: 2px solid whitesmoke;
                    border-radius: 5px;
                    background-color: #002E5D;
                    color: whitesmoke;
                }
            #searchBar::placeholder {
                    color: lightgray;
                }
        </style>
    </head>
    <body>
        <h1>Topics</h1>

        <a href="../index.html">Home</a>

        <br><br>

        <input type="text" id="searchBar" placeholder="Search topics..." onkeyup="searchTopics()">

        <div class="container-flex">
            <ul id="topicList" style="text-align:left;">
                <li><a href="topics/brighamyoung.html">Brigham Young</a></li>
                <li><a href="topics/josephsmithjr.html">Joseph Smith Jr.</a></li>
                <li><a href="topics/facecards.html">Face Cards</a></li>
                <li><a href="topics/pioneers.html">Pioneers</a></li>
                <li><a href="topics/planofsalvation.html">Plan of Salvation</a></li>
                <li><a href="topics/prophets.html">Prophets</a></li>
                <li><a href="topics/revelation.html">Revelation</a></li>
                <li><a href="topics/hypnotism.html">Hypnotism</a></li>
                <li><a href="topics/wilfordwoodruff.html">Wilford Woodruff</a></li>
                <li><a href="topics/zion.html">Zion</a></li>
            </ul>
        </div>

        <script>
            function searchTopics() {
                let input = document.getElementById("searchBar").value.toLowerCase();
                let ul = document.getElementById("topicList");
                let li = ul.getElementsByTagName("li");

                for (let i = 0; i < li.length; i++) {
                    let text = li[i].textContent || li[i].innerText;

                    if (text.toLowerCase().indexOf(input) > -1) {
                        li[i].style.display = "";
                    } else {
                        li[i].style.display = "none";
                    }
                }
            }
        </script>
    </body>
</html>
